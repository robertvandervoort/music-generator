map $http_cf_ipcountry $rum_cf_country {
  default "";
  "~^[A-Za-z0-9]{2}$" $http_cf_ipcountry;
}

map $http_cf_region $rum_cf_region {
  "~[<>\"'`\\\\&]" "";
  "~[[:cntrl:]]" "";
  "~^.{81}" "";
  default $http_cf_region;
}

map $http_cf_ipcity $log_cf_city {
  "" $http_cf_city;
  default $http_cf_ipcity;
}

limit_req_zone $binary_remote_addr zone=rum_trace:1m rate=20r/s;

log_format turingmusic_json escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"cf_country":"$http_cf_ipcountry",'
    '"cf_region":"$http_cf_region",'
    '"cf_city":"$log_cf_city"'
  '}';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # sub_filter only rewrites uncompressed HTML.
  gzip off;
  charset utf-8;

  access_log /var/log/nginx/access.log turingmusic_json;

  sub_filter_once off;
  sub_filter '__CF_COUNTRY__' '$rum_cf_country';
  sub_filter '__CF_REGION__' '$rum_cf_region';

  location = /index.html {
    sendfile off;
    etag off;
    if_modified_since off;
    add_header Cache-Control "private, no-store" always;
    add_header Vary "CF-IPCountry, cf-region" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Same-origin OTLP/HTTP JSON proxy. Docker DNS is resolved at request time.
  location = /rum/trace {
    limit_except POST { deny all; }
    limit_req zone=rum_trace burst=40 nodelay;
    limit_req_status 429;

    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 10s;
    proxy_request_buffering on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $otel_host otel-collector;
    proxy_pass http://$otel_host:4318/v1/traces;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host otel-collector:4318;
    proxy_set_header Content-Type application/json;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
  }
}
