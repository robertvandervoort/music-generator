services:
  music-generator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_RUM_SAMPLE_RATE: ${VITE_RUM_SAMPLE_RATE:-1}
        VITE_RUM_TRACES_URL: ${VITE_RUM_TRACES_URL:-https://vdvlabs.ai/rum/v1/traces}
    image: music-generator:web
    container_name: music-generator
    restart: unless-stopped
    expose:
      - "80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - default
      - vdv-shared-network

networks:
  default:
    driver: bridge
  vdv-shared-network:
    name: vdv-website-network
    external: true
